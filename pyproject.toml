[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-cluster-mesh"
version = "0.1.0"
description = "Zero-Restart Elastic RDMA Partition Arbiter & Multi-Tier Gradient Resumption Mesh for High-Scale GPU Clusters (NCCL / PyTorch FSDP2)"
authors = [
    { name = "Ahmed Hassan", email = "ahmed.alaa.hassan25@gmail.com" }
]
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "typing_extensions>=4.8.0",
]
